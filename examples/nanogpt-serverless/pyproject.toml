[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanogpt-serverless"
version = "1.0.0"
description = "Serverless Federated NanoGPT on Tiny Shakespeare with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.13",
    "torch>=2.0.0",
    "numpy",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
